[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cas-cashflow-main-workpaper"
version = "0.1.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
  "pandas>=3.0,<4",
  "pyarrow>=25,<26",
  "openpyxl>=3.1,<4",
  "xlsxwriter>=3.2,<4",
  "jsonschema>=4.23,<5",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "PyMuPDF>=1.28,<2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
